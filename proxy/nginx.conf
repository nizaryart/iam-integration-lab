worker_processes 1;
events { worker_connections 256; }

http {
  resolver 127.0.0.11 valid=10s;   # Docker DNS, so upstreams can restart
  server_tokens off;
  log_format main '$remote_addr "$host" "$request" $status upstream=$upstream_addr';
  access_log /dev/stdout main;

  ssl_certificate     /etc/nginx/tls/proxy.pem;
  ssl_certificate_key /etc/nginx/tls/proxy.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  proxy_set_header Host              $host:$server_port;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;

  # Unknown host names are refused.
  server {
    listen 7443 ssl default_server;
    return 444;
  }

  # Public SSO endpoint: login pages, OIDC/SAML protocol endpoints only.
  server {
    listen 7443 ssl;
    server_name sso.localtest.me;
    set $kc http://keycloak:8080;

    # The management plane is never exposed on the public listener.
    location /admin/         { return 403; }
    location /realms/master/ { return 403; }
    location /metrics        { return 403; }

    location / { proxy_pass $kc; }
  }

  # Management listener: separate port, never routed from the public listener.
  server {
    listen 7444 ssl;
    server_name sso-admin.localtest.me;
    set $kc http://keycloak:8080;
    location / { proxy_pass $kc; }
  }

  server {
    listen 7443 ssl;
    server_name portal.localtest.me;
    set $app http://portal-oidc:5000;
    location / { proxy_pass $app; }
  }

  server {
    listen 7443 ssl;
    server_name saml.localtest.me;
    set $app http://portal-saml:5000;
    location / { proxy_pass $app; }
  }
}
